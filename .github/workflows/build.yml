name: Build SRP Animation Util
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: JAVA_HOME="$JAVA_HOME_17_X64" gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: SRPAnimationUtil-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error
