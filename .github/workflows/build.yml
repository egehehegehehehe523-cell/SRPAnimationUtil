name: Build SRP Animation Util
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Test transform gizmo math
        run: |
          mkdir -p /tmp/srpau-gizmo-test
          javac -d /tmp/srpau-gizmo-test src/main/java/dev/srpau/TransformGizmo.java tests/TransformGizmoTest.java
          java -cp /tmp/srpau-gizmo-test dev.srpau.TransformGizmoTest
          javac -d /tmp/srpau-gizmo-test src/main/java/dev/srpau/KeyframeTiming.java src/main/java/dev/srpau/EditHistory.java tests/KeyframeTimingTest.java
          java -cp /tmp/srpau-gizmo-test dev.srpau.KeyframeTimingTest
          javac -d /tmp/srpau-gizmo-test src/main/java/dev/srpau/AdventurerUV.java tests/AdventurerUVTest.java
          java -cp /tmp/srpau-gizmo-test dev.srpau.AdventurerUVTest
          javac -d /tmp/srpau-gizmo-test src/main/java/dev/srpau/FootPlant.java tests/FootPlantTest.java
          java -cp /tmp/srpau-gizmo-test dev.srpau.FootPlantTest
          javac -cp /tmp/srpau-gizmo-test -d /tmp/srpau-gizmo-test tests/AuthoredFootTest.java
          java -cp /tmp/srpau-gizmo-test dev.srpau.AuthoredFootTest
          javac -cp /tmp/srpau-gizmo-test -d /tmp/srpau-gizmo-test src/main/java/dev/srpau/JointBridge.java tests/JointBridgeTest.java
          java -cp /tmp/srpau-gizmo-test dev.srpau.JointBridgeTest
          javac -cp /tmp/srpau-gizmo-test -d /tmp/srpau-gizmo-test src/main/java/dev/srpau/TorsoMotion.java tests/TorsoMotionTest.java
          java -cp /tmp/srpau-gizmo-test dev.srpau.TorsoMotionTest
          javac -d /tmp/srpau-gizmo-test src/main/java/dev/srpau/WalkMotion.java tests/WalkMotionTest.java
          java -cp /tmp/srpau-gizmo-test dev.srpau.WalkMotionTest
          javac -cp /tmp/srpau-gizmo-test -d /tmp/srpau-gizmo-test tests/PursuitMotionTest.java
          java -cp /tmp/srpau-gizmo-test dev.srpau.PursuitMotionTest
          javac -d /tmp/srpau-gizmo-test src/main/java/dev/srpau/PeekLock.java tests/PeekLockTest.java
          java -cp /tmp/srpau-gizmo-test dev.srpau.PeekLockTest
      - run: JAVA_HOME="$JAVA_HOME_17_X64" gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: SRPAnimationUtil-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error
