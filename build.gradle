plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'wtf.gofancy.fancygradle' version '1.1.3-0'
}
group = 'dev.srpau'
version = '0.1.3'
base.archivesName = 'SRPAnimationUtil-1.12.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(8)
minecraft {
    mappings channel: 'stable', version: '39-1.12'
}
repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/maven' }
    maven { url = 'https://www.cursemaven.com' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    compileOnly fg.deobf('curse.maven:tabula-minecraft-modeler-229092:2801270')
    compileOnly fg.deobf('curse.maven:ichunutil-229060:2801262')
    compileOnly 'org.spongepowered:mixin:0.8.7'
}
fancyGradle { patches { resources; coremods; asm; mergetool } }
jar {
    manifest.attributes('MixinConfigs': 'mixins.srpau.json')
    finalizedBy 'reobfJar'
}
compileJava.options.compilerArgs += ['-proc:none']
